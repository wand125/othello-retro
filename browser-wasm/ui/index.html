<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="オセロの盤面から棋譜を復元し、巻き戻して一手ずつ再生します。">
  <title>逆算オセロ</title>
  <link rel="stylesheet" href="short.css">
  <script src="verify.js" defer></script>
  <script src="record-codec.js" defer></script>
  <script src="short.js" defer></script>
  <script src="register-sw.js" defer></script>
</head>
<body>
  <main>
    <div id="theater">
    <article class="film" id="film" data-phase="editing" aria-label="オセロ逆算シミュレータ、9対16">
      <h1 class="film-title">逆算オセロ</h1>
      <div class="scene"><div class="board-wrap"><div class="columns" aria-hidden="true"></div><div class="rows" aria-hidden="true"></div><div class="board" id="board" role="group" aria-label="目標盤面。マスを押して配置を変更"></div></div><div id="solve-slot" class="solve-slot"><button class="primary" id="solve" type="button" aria-label="計算開始" title="計算開始"><span class="sr-only" id="solve-label">計算開始</span><svg class="rewind-icon" viewBox="0 0 32 32" aria-hidden="true"><path class="rewind-circle" transform="translate(-1.92 -1.92) scale(1.12)" d="M5.2 12a11.5 11.5 0 1 1 2.5 12.5M5 5v7h7"/><path class="rewind-marks" d="m16 12-7 4 7 4Zm7 0-7 4 7 4Z"/></svg></button><button type="button" id="cancel" class="primary stop-button" aria-label="計算を中断" title="計算を中断" hidden><svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx=".8"/></svg></button><p id="input-error" class="input-error" role="status" aria-live="polite" hidden>巻き戻し不可能な盤面です</p></div></div>
      <div class="sr-only" aria-hidden="true" hidden><span id="eyebrow"></span><h1 id="headline"></h1><span id="subtitle"></span><span id="black-count"></span><span id="white-count"></span><span id="position-label"></span><span id="move-badge"></span><span id="step-edit"></span><span id="step-rewind"></span><span id="step-replay"></span><span id="footer-label"></span></div>
    </article>
    </div>
    <div class="panel" aria-label="操作">
      <button type="button" id="reset-board" class="icon-button" aria-label="初期配置に戻す" title="初期配置に戻す"><svg class="initial-board-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="1" fill="#347a53" stroke="currentColor" stroke-width="1"/><path d="M12 3v18M3 12h18" opacity=".5"/><circle cx="7.5" cy="7.5" r="3.1" fill="#f4f4ef" stroke="#d9dfd5" stroke-width=".6"/><circle cx="16.5" cy="7.5" r="3.1" fill="#131b15" stroke="#080d09" stroke-width=".6"/><circle cx="7.5" cy="16.5" r="3.1" fill="#131b15" stroke="#080d09" stroke-width=".6"/><circle cx="16.5" cy="16.5" r="3.1" fill="#f4f4ef" stroke="#d9dfd5" stroke-width=".6"/></svg></button>
      <button type="button" id="edit-board" class="icon-button" aria-label="盤面を編集" title="盤面を編集"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-1 5 5-1L20 8l-4-4Zm10-10 4 4"/></svg></button>
      <button type="button" id="share-board" class="icon-button" aria-label="作成した棋譜をシェア" title="作成した棋譜をシェア" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 11v9h14v-9"/></svg></button>
      <div class="action-area">
        <div id="edit-controls"></div>
        <div id="search-controls" hidden><div class="search-line"><time id="elapsed">0秒</time><span class="activity" aria-hidden="true"></span><span id="search-text" class="sr-only"></span></div><div class="search-track" aria-hidden="true"><span></span></div></div>
        <div id="play-controls" hidden><div class="seek-line"><button type="button" id="prev" class="icon-button" aria-label="一手戻る" title="一手戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-8 6 8 6"/></svg></button><input id="seek" type="range" min="0" max="1" value="0" aria-label="表示する手数"><span id="ply" class="seek-ply" hidden>0 / 0</span><button type="button" id="next" class="icon-button" aria-label="一手進む" title="一手進む"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 8 6-8 6"/></svg></button></div></div>
      </div>
      <button type="button" id="voice-settings" class="icon-button voice-settings" aria-label="音色の設定" title="音色：木の石"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13M9 9l10-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="16" cy="16" rx="3" ry="2"/></svg></button>
      
      <button id="settings" type="button" class="icon-button" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14M9 4v4m6 2v4m-7 2v4"/></svg></button>
      <button id="sound" class="icon-button sound-button" type="button" aria-label="音を消す" aria-pressed="true" title="音を消す"><svg id="sound-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
      

      
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="policy">この端末で計算・保存します</p>
  </main>
  <dialog id="session-dialog" aria-label="盤面の操作"><form method="dialog"><div class="dialog-heading"><button class="icon-button" aria-label="閉じて戻る" value="cancel">×</button></div></form><div id="session-choices" class="session-choices"><button type="button" id="new-session"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="22" height="22" rx="2"/><path d="M16 10v12M10 16h12"/></svg><span>新規作成</span></button><button type="button" id="load-session"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 25V8h9l3 4h12v13ZM4 15h24"/><path d="M16 17v6m-3-3 3 3 3-3"/></svg><span>読み込む</span></button></div><section id="session-library" hidden><div class="library-grid"><div id="local-records" class="record-list"></div><div id="public-records" class="record-list"></div></div><p id="library-status" role="status"></p><button type="button" id="more-records" class="library-more" hidden>続きを表示</button></section></dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><form method="dialog"><div class="dialog-heading"><h2 id="settings-title">設定</h2><button class="icon-button" aria-label="閉じる" value="close">×</button></div></form><div id="voice-group" class="setting-group"><p id="voice-label">音色</p><div id="voice-options" class="toggle-group" role="group" aria-labelledby="voice-label"></div></div><div class="setting-group"><p id="output-label">音声出力</p><div id="output-options" class="toggle-group" role="group" aria-labelledby="output-label"></div><p id="output-status" class="hint" role="status" hidden></p></div><div class="setting-group"><p id="engine-label">探索方法</p><div id="engine-options" class="toggle-group" role="group" aria-labelledby="engine-label"></div><p class="hint">Autoは軽量モデルで候補を絞り、SATで合法な手順を確認します。見つからない場合はSATで探索します。</p></div><div class="setting-group"><p>盤面</p><div class="setting-buttons" id="transform-controls"><button type="button" data-transform="swap">白黒入替</button><button type="button" data-transform="rotate">右へ90°回転</button><button type="button" data-transform="mirror">左右反転</button><button type="button" id="initial-board">初期配置</button></div></div><div class="setting-group"><p>保存・読み込み</p><div class="setting-buttons"><button type="button" id="download-record">JSONを保存</button><button type="button" id="import-record">JSONを読み込む</button></div><input id="record-file" type="file" accept="application/json,.json" hidden><p id="file-status" role="status"></p></div></dialog>
  <dialog id="share-dialog" aria-labelledby="share-title"><form method="dialog"><div class="dialog-heading"><h2 id="share-title">棋譜をシェア</h2><button class="icon-button" aria-label="閉じる" value="close">×</button></div></form><input id="share-url" type="url" readonly aria-label="棋譜のURL"><div class="share-options"><button type="button" id="copy-share-url"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/></svg><span>URLをコピー</span></button><a id="share-x" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 3 12 18h4L8 3ZM20 3 4 21"/></svg><span>Xに投稿</span></a><a id="share-line" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 5-5 8-11 11l1-4C5 17 2 14 2 10s4-7 10-7 9 3 9 7Z"/><path d="M7 8v5h2m3-5v5m3 0V8l3 5V8"/></svg><span>LINEで送る</span></a></div><p id="share-status" role="status" aria-live="polite"></p></dialog>
</body>
</html>
