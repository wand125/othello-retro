<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>端末での探索時間 — 逆算オセロ</title><style>body{font:16px/1.7 system-ui,sans-serif;background:#111;color:#ddd;max-width:800px;margin:32px auto;padding:0 16px}a{color:#a9d7bb}button,select{font:inherit;padding:8px 12px;background:#292929;color:#eee;border:1px solid #777;border-radius:4px}button:disabled{opacity:.4}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #444}td:first-child{overflow-wrap:anywhere}#progress{min-height:2em}pre{white-space:pre-wrap;font-size:12px}.controls{display:flex;flex-wrap:wrap;gap:10px}</style>
<h1>この端末で探索時間を測る</h1><p>棋譜キャッシュを使わず、盤面ごとに新しいWorkerで計算します。ファイルの読込時間も含みます。各盤面は60秒で観測を止め、見つかった棋譜を独立に再生します。時間切れは到達不能という意味ではありません。</p><p>途中20盤面・終局20盤面の固定セットです。充電と端末の温度、ブラウザの状態によって時間は変わります。測定中はページを前面に置いてください。データはこの端末内に残り、保存ボタンでJSONを取得できます。</p>
<div class="controls"><select id="engine" aria-label="探索方式"><option value="sat">SAT</option><option value="auto">Auto</option></select><select id="suite" aria-label="盤面セット"><option value="quick">途中5盤面（各石数の先頭）</option><option value="midgame">途中20盤面</option><option value="endgame">終局20盤面</option><option value="all">全40盤面</option></select><button id="run">測定する</button><button id="stop" disabled>中断</button><button id="save" disabled>JSONを保存</button></div>
<p id="progress" role="status"></p><table><thead><tr><th>盤面</th><th>結果</th><th>秒</th><th>経路</th></tr></thead><tbody id="results"></tbody></table><p><a href="./">逆算オセロに戻る</a></p><script src="verify.js"></script><script src="benchmark.js"></script></html>
